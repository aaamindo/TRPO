<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Мой сайт</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        #header {
            background: #333;
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .brand img {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background: #fff;
                margin: 0;
            }

            .brand h1 {
                font-size: 1.3rem;
                margin: 0;
            }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: .95rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background .2s;
        }

            nav a:hover {
                background: #2563eb;
            }

        img {
            width: 300px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .info {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }

        footer {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="header">
        <div class="brand">
            <img src="https://via.placeholder.com/50" alt="Логотип колледжа" />

        </div>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="project.html">Проекты</a></li>
                <li><a href="price.html">Мерч</a></li>
            </ul>
        </nav>
    </div>

    <img src="https://picsum.photos/300/200" alt="Пример картинки" />

    <div class="info">
        <h2>О сайте</h2>
        <p>Это компактный HTML-документ, созданный в Visual Studio. Здесь есть изображение, заголовок и немного текстовой информации.</p>
